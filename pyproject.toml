[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codepulse-cli"
version = "0.1.3"
description = "Reveal a codebase's health from its git history — hotspots, bus factor, hidden coupling, and a CI risk gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mehouelley", email = "fabricemehouelley43@gmail.com" }]
keywords = ["git", "code-health", "hotspots", "technical-debt", "static-analysis", "devops", "code-quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/Mehouelley/codepulse"
Repository = "https://github.com/Mehouelley/codepulse"
Issues = "https://github.com/Mehouelley/codepulse/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.0", "twine>=5.0"]

[project.scripts]
codepulse = "codepulse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codepulse"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
